name: Feature request
description: Propose a focused gesture, action, performance, or accessibility improvement
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the workflow problem rather than only naming a feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include trigger conflicts, accidental-touch risks, and expected defaults.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy baseline
      options:
        - label: This proposal can work without reading accessibility window content.
        - label: This proposal can work without adding network access.
